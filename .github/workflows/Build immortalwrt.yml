name: Build immortalwrt

on:
  workflow_dispatch:
    inputs:
      docker:
        description: 'Docker einbinden'
        required: false
        default: 'false'
      tag2:
        description: 'ImmortalWrt Version/Tag'
        required: false
        default: 'master'

permissions:
  contents: write

env:
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE_DOCKER: ./config/docker.config
  DIY_P1_SH: ./sh/scripts-part1.sh
  DIY_P2_SH: ./sh/scripts-part2.sh
  DEFAULT_SETTING: ./default-settings-m0eak
  UPLOAD_BIN_DIR: true
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Europe/Berlin
  GOTOOLCHAIN: auto

jobs:
  build:
    name: 编译 ${{ matrix.device }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: GL-MT5000
            repo_url: https://github.com/immortalwrt/immortalwrt.git
            repo_branch: master
            config_file: ./config/immortalwrt.config
            workflow_name: gl-mt5000_immortalwrt

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: 释放磁盘空间
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force

    - name: 初始化环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get update
        sudo -E apt-get -y install dos2unix libfuse-dev
        sudo bash -c 'bash <(curl -s https://build-scripts.immortalwrt.org/init_build_environment.sh)'
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir
        echo "WORKFLOW_NAME=${{ matrix.workflow_name }}" >> $GITHUB_ENV
        INPUT_TAG2="${{ github.event.inputs.tag2 }}"
        [ -z "$INPUT_TAG2" ] && INPUT_TAG2="master"
        echo "TAG2=$INPUT_TAG2" | tr ' ' '_' >> $GITHUB_ENV

    - name: 克隆源代码
      working-directory: /workdir
      run: |
        git clone ${{ matrix.repo_url }} --single-branch -b ${{ matrix.repo_branch }} openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: 加载自定义源
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        [ -f $DIY_P1_SH ] && chmod +x $DIY_P1_SH
        cd openwrt
        sed -i 's/.*video/#&/' feeds.conf.default || true
        [ -f $GITHUB_WORKSPACE/$DIY_P1_SH ] && $GITHUB_WORKSPACE/$DIY_P1_SH || true
        ./scripts/feeds update -a

    - name: 安装源
      run: cd openwrt && ./scripts/feeds install -a

    - name: 加载自定义配置
      run: |
        [ -e $DEFAULT_SETTING ] && mv $DEFAULT_SETTING openwrt/package/default-settings-m0eak
        [ -e files ] && mv ./files openwrt/files
        [ -e ${{ matrix.config_file }} ] && mv ${{ matrix.config_file }} openwrt/.config
        if [ "${{ github.event.inputs.docker }}" = "true" ] && [ -e $CONFIG_FILE_DOCKER ]; then
          cat $CONFIG_FILE_DOCKER >> openwrt/.config
        fi

        [ -f $DIY_P2_SH ] && chmod +x $DIY_P2_SH
        cd openwrt
        [ -f $GITHUB_WORKSPACE/$DIY_P2_SH ] && $GITHUB_WORKSPACE/$DIY_P2_SH || true

        # Reale OpenWrt-Paketsymbole für Realtek DSA erzwingen
        echo "CONFIG_PACKAGE_kmod-dsa=y" >> .config
        echo "CONFIG_PACKAGE_kmod-dsa-realtek=y" >> .config
        echo "CONFIG_PACKAGE_kmod-dsa-rtl8366rb=y" >> .config
        echo "CONFIG_PACKAGE_kmod-dsa-tag-rtl4-a=y" >> .config
        echo "CONFIG_PACKAGE_kmod-switch-rtl8366-smi=y" >> .config

        make defconfig
        make -C target/linux olddefconfig || true

        echo "=== Überprüfe Status der DSA-Treiber in .config ==="
        grep -E "CONFIG_PACKAGE_kmod-dsa.*=y|CONFIG_PACKAGE_kmod-switch.*=y" .config || true

    - name: 下载软件包
      id: package
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec rm -f {} \;

    - name: 编译固件
      id: compile
      run: |
        cd openwrt
        make -j$(nproc) || make -j1 V=s target/linux/compile
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV
        echo "compile=success" >> $GITHUB_OUTPUT
        echo "device-name=$(cat DEVICE_NAME)" >> $GITHUB_OUTPUT
        echo "file-date=$(date +"%Y%m%d%H%M")" >> $GITHUB_OUTPUT

    - name: 上传 bin 目录
      uses: actions/upload-artifact@v4
      if: steps.compile.outputs.compile == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: ImmortalWrt_bin_${{ steps.compile.outputs.device-name }}-${{ steps.compile.outputs.file-date }}
        path: openwrt/bin

    - name: GitHub Release erstellen
      uses: softprops/action-gh-release@v2
      if: steps.compile.outputs.compile == 'success' && !cancelled()
      with:
        name: ImmortalWrt Brume 3 (GL-MT5000) ${{ steps.compile.outputs.file-date }}
        tag_name: ImmortalWrt_GL-MT5000_${{ steps.compile.outputs.file-date }}
        body: |
          ImmortalWrt Build für GL.iNet MT5000 mit integriertem RTL8366 DSA-Treiber und USB-Storage Support.
        files: |
          openwrt/bin/targets/*/*/*sysupgrade*
          openwrt/bin/targets/*/*/*factory*
          openwrt/bin/targets/*/*/*manifest*
          openwrt/bin/targets/*/*/*sha256sums
