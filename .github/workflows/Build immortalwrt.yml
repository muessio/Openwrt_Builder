name: Build ImmortalWrt Brume 3 (GL-MT5000)

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      docker:
        description: '是否编译docker'
        required: false
        default: 'false'
      tag2:
        description: 'ImmortalWrt版本'
        required: false
        default: 'master'

permissions:
  contents: write

env:
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE_DOCKER: ./config/docker.config
  DIY_P1_SH: ./sh/scripts-part1.sh
  DIY_P2_SH: ./sh/scripts-part2.sh
  DEFAULT_SETTING: ./default-settings-m0eak
  UPLOAD_BIN_DIR: true
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Europe/Berlin
  GOTOOLCHAIN: auto

jobs:
  build:
    name: 编译 ${{ matrix.device }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: GL-MT5000
            repo_url: https://github.com/immortalwrt/immortalwrt.git
            repo_branch: master
            config_file: ./config/immortalwrt.config
            workflow_name: gl-mt5000_immortalwrt
            sonic_fullcone: "true"

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: 显示调试上下文
      run: |
        echo "::group::Workflow inputs"
        echo "docker=${{ github.event.inputs.docker }}"
        echo "tag2=${{ github.event.inputs.tag2 }}"
        echo "device=${{ matrix.device }}"
        echo "config-file=${{ matrix.config_file }}"
        echo "docker-config=$CONFIG_FILE_DOCKER"
        echo "feeds-conf=$FEEDS_CONF"
        echo "diy-p1-sh=$DIY_P1_SH"
        echo "diy-p2-sh=$DIY_P2_SH"
        echo "default-setting=$DEFAULT_SETTING"
        for path in "${{ matrix.config_file }}" "$CONFIG_FILE_DOCKER" "$FEEDS_CONF" "$DIY_P1_SH" "$DIY_P2_SH" "$DEFAULT_SETTING" "files"; do
          if [ -e "$path" ]; then
            echo "exists: $path"
          else
            echo "missing: $path"
          fi
        done
        echo "::endgroup::"

    - name: 释放磁盘空间
      run: |
        echo "::group::Disk cleanup"
        echo "清理前磁盘空间："
        df -hT
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        echo "清理后磁盘空间："
        df -hT
        echo "::endgroup::"

    - name: 初始化环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get update
        sudo -E apt-get -y install dos2unix libfuse-dev
        sudo bash -c 'bash <(curl -s https://build-scripts.immortalwrt.org/init_build_environment.sh)'
        sudo -E systemctl daemon-reload
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir
        echo "WORKFLOW_NAME=${{ matrix.workflow_name }}" >> $GITHUB_ENV
        INPUT_TAG2="${{ github.event.inputs.tag2 }}"
        if [ -z "$INPUT_TAG2" ]; then
          INPUT_TAG2="master"
        fi
        echo "TAG2=$INPUT_TAG2" | tr ' ' '_' >> $GITHUB_ENV

    - name: 克隆源代码
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone ${{ matrix.repo_url }} --single-branch -b ${{ matrix.repo_branch }} openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
        cd openwrt

        echo "::group::Import GL-MT5000 Support"
        git clone --depth 1 -b mt5000 https://github.com/GLiNet-Tech/openwrt.git /tmp/glinet-src
        mkdir -p target/linux/mediatek/dts target/linux/mediatek/files/arch/arm64/boot/dts/mediatek target/linux/mediatek/filogic/base-files
        cp -f /tmp/glinet-src/target/linux/mediatek/dts/*gl-mt5000* target/linux/mediatek/dts/ 2>/dev/null || true
        cp -f /tmp/glinet-src/target/linux/mediatek/files/arch/arm64/boot/dts/mediatek/*gl-mt5000* target/linux/mediatek/files/arch/arm64/boot/dts/mediatek/ 2>/dev/null || true
        cp -rf /tmp/glinet-src/target/linux/mediatek/filogic/base-files/* target/linux/mediatek/filogic/base-files/ 2>/dev/null || true

        # Importiert die Gerätedefinition und registriert sie zwingend im Image-Builder
        for mk in /tmp/glinet-src/target/linux/mediatek/image/*.mk; do
          if grep -q -i "mt5000" "$mk"; then
            echo "Gefunden in $mk -> importiere nach filogic.mk"
            sed -n '/define Device\/glinet_gl-mt5000/,/endef/p' "$mk" >> target/linux/mediatek/image/filogic.mk
            echo '$(eval $(call BuildImage,glinet_gl-mt5000))' >> target/linux/mediatek/image/filogic.mk
            echo 'TARGET_DEVICES += glinet_gl-mt5000' >> target/linux/mediatek/image/filogic.mk
          fi
        done

        # Sicherheits-Check: Sofortiger Abbruch bei Minute 1, falls der Block fehlt
        echo "=== Überprüfe injizierte Definition in filogic.mk ==="
        grep -n -A 15 -i "Device/glinet_gl-mt5000" target/linux/mediatek/image/filogic.mk || { echo "FEHLER: MT5000 Gerätedefinition wurde nicht gefunden!"; exit 1; }

        rm -rf /tmp/glinet-src
        rm -rf tmp
        echo "::endgroup::"

        echo "::group::OpenWrt source revision"
        git log -1 --oneline
        git remote -v
        git status --short
        echo "::endgroup::"
        echo "OPENWRT_PATH=$PWD" >> $GITHUB_ENV

    - name: 加载自定义源
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        [ -f $DIY_P1_SH ] && chmod +x $DIY_P1_SH
        cd openwrt

        sed -i 's/.*video/#&/' feeds.conf.default || true

        echo "::group::Feeds configuration"
        pwd
        ls -l feeds.conf.default || true
        sed -n '1,80p' feeds.conf.default || true
        echo "::endgroup::"
        ./scripts/feeds update -a
        [ -f $GITHUB_WORKSPACE/$DIY_P1_SH ] && $GITHUB_WORKSPACE/$DIY_P1_SH || true

    - name: 安装源
      run: cd openwrt && ./scripts/feeds install -a

    - name: 加载自定义配置
      run: |
        [ -e $DEFAULT_SETTING ] && mv $DEFAULT_SETTING openwrt/package/default-settings-m0eak
        [ -e files ] && mv ./files openwrt/files
        [ -e ${{ matrix.config_file }} ] && mv ${{ matrix.config_file }} openwrt/.config
        if [ "${{ github.event.inputs.docker }}" = "true" ] && [ -e $CONFIG_FILE_DOCKER ]; then
          cat $CONFIG_FILE_DOCKER >> openwrt/.config
        fi

        # Verhindert den Kconfig-Fehler durch Squeezelite
        sed -i '/CONFIG_PACKAGE_squeezelite/d' openwrt/.config 2>/dev/null || true
        echo "# CONFIG_PACKAGE_squeezelite-custom is not set" >> openwrt/.config

        [ -f $DIY_P2_SH ] && chmod +x $DIY_P2_SH
        cd openwrt
        echo "::group::Pre-defconfig workspace snapshot"
        pwd
        ls -ld package/default-settings-m0eak files .config 2>/dev/null || true
        grep -E '^(CONFIG_TARGET|CONFIG_PACKAGE_(docker|dockerd|luci-app-dockerman|containerd|runc))' .config || true
        echo "::endgroup::"
        [ -f $GITHUB_WORKSPACE/$DIY_P2_SH ] && $GITHUB_WORKSPACE/$DIY_P2_SH || true
        
        # Generiert die finale Konfiguration
        make defconfig

        echo "::group::当前 diffconfig"
        ./scripts/diffconfig.sh
        echo "::endgroup::"

        # Validierungs-Schritt: Bricht sofort ab, falls make defconfig wieder auf openwrt_one zurückgefallen ist
        echo "=== Überprüfe gewähltes Target ==="
        grep "^CONFIG_TARGET_mediatek_filogic_DEVICE_glinet_gl-mt5000=y" .config || {
          echo "FEHLER: Build-System hat gl-mt5000 verworfen!"
          echo "Aktuell ausgewähltes Target:"
          grep "^CONFIG_TARGET_mediatek_filogic_DEVICE_" .config
          exit 1
        }

    - name: 检查并恢复缓存
      id: check-cache
      uses: actions/cache@v4
      with:
        key: ${{ runner.os }}-${{ github.workflow }}-${{ matrix.device }}-${{ env.TAG2 }}-${{ hashFiles('openwrt/.config', 'openwrt/feeds.conf.default', '**/scripts-part*.sh') }}
        restore-keys: |
          ${{ runner.os }}-${{ github.workflow }}-${{ matrix.device }}-${{ env.TAG2 }}-
        path: |
          openwrt/.ccache
          openwrt/staging_dir/host*
          openwrt/staging_dir/tool*

    - name: 更新缓存并处理时间戳
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "cache-hit=${{ steps.check-cache.outputs.cache-hit }}"
        if [ "${{ steps.check-cache.outputs.cache-hit }}" == "true" ]; then
          echo "缓存命中，更新时间戳..."
          cd openwrt
          find staging_dir -type d -name "stamp" -not -path "*target*" | while read -r DIR; do
            find "$DIR" -type f -exec touch {} +
          done
          echo "时间戳更新完毕!"
        else
          echo "缓存未命中，开始主动清理相关的旧缓存..."
          rm -rf openwrt/dl/go-mod-cache
          CACHE_LIST=$(gh cache list --key "${{ runner.os }}-${{ github.workflow }}-${{ matrix.device }}-${{ env.TAG2 }}" | cut -f 1 || true)
          if [ -n "$CACHE_LIST" ]; then
            for CACHE_KEY in $CACHE_LIST; do
              echo "删除旧缓存: $CACHE_KEY"
              gh cache delete "$CACHE_KEY" || true
            done
            echo "相关旧缓存清理完毕!"
          else
            echo "没有找到相关的旧缓存。"
          fi
        fi

    - name: 下载软件包
      id: package
      run: |
        cd openwrt
        make download -j8
        echo "::group::Download directory summary"
        du -sh dl || true
        find dl -size -1024c -exec ls -l {} \;
        echo "::endgroup::"
        find dl -size -1024c -exec rm -f {} \;

    - name: 编译固件
      id: compile
      env:
        GOTOOLCHAIN: auto
      run: |
        cd openwrt
        echo -e "$(nproc) 线程编译"
        make -j$(expr $(nproc) + 1) || make -j1 V=s
        echo "compile-status=success" >> $GITHUB_ENV
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV
        echo "compile=success" >> $GITHUB_OUTPUT
        if [ -s DEVICE_NAME ]; then
          echo "device-name=$(cat DEVICE_NAME)" >> $GITHUB_OUTPUT
        fi
        echo "file-date=$(date +"%Y%m%d%H%M")" >> $GITHUB_OUTPUT
        echo "::group::Compile outputs"
        echo "device-name=$(cat DEVICE_NAME 2>/dev/null || true)"
        echo "file-date=$(date +"%Y%m%d%H%M")"
        find bin/targets -maxdepth 3 -type f -printf '%p %s bytes\n' | sort || true
        echo "::endgroup::"

    - name: 检查空间使用情况
      if: (!cancelled())
      run: df -hT

    - name: 上传 bin 目录
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.compile == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: ImmortalWrt_bin_${{ steps.compile.outputs.device-name }}-${{ steps.compile.outputs.file-date }}
        path: openwrt/bin

    - name: GitHub Release erstellen
      uses: softprops/action-gh-release@v2
      if: steps.compile.outputs.compile == 'success' && !cancelled()
      with:
        name: ImmortalWrt Brume 3 (GL-MT5000) ${{ steps.compile.outputs.file-date }}
        tag_name: ImmortalWrt_GL-MT5000_${{ steps.compile.outputs.file-date }}
        body: |
          Offizieller ImmortalWrt Build mit gepatchtem GL.iNet MT5000 Target-Support.
          Basis: ${{ matrix.repo_url }} (${{ matrix.repo_branch }})
          Datum: ${{ steps.compile.outputs.file-date }}
        files: |
          openwrt/bin/targets/*/*/*sysupgrade*
          openwrt/bin/targets/*/*/*factory*
          openwrt/bin/targets/*/*/*initramfs*
          openwrt/bin/targets/*/*/*manifest*
          openwrt/bin/targets/*/*/*sha256sums
