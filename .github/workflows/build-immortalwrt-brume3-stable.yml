name: Immortalwrt Brume 3 stable

on:
  repository_dispatch:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt.git
  REPO_BRANCH: openwrt-25.12
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: immortalwrt.config
  DIY_P1_SH: sh/scripts-part1.sh
  DIY_P2_SH: sh/scripts-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Europe/Berlin

jobs:
  build:
    name: Kompiliere GL-MT5000 Stable
    runs-on: ubuntu-22.04

    steps:
    - name: Repository auschecken
      uses: actions/checkout@v4

    - name: Speicherplatz freigeben
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Build-Umgebung initialisieren
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y $(cat package/depends-ubuntu-2204)
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Quellcode klonen
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b$REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Feeds laden und DIY-Skript Teil 1 ausführen
      run: |
        [ -e $FEEDS_CONF ] && cp$FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH
        ./scripts/feeds update -a

    - name: Feeds installieren
      run: cd openwrt && ./scripts/feeds install -a

    - name: Benutzerdefinierte Konfiguration anwenden und DSA-Treiber injizieren
      run: |
        [ -e $CONFIG_FILE ] && cp$CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

        # DSA-Treiber direkt in die Konfiguration injizieren
        cat >> .config << 'EOF'
        CONFIG_PACKAGE_kmod-dsa=y
        CONFIG_PACKAGE_kmod-dsa-realtek=y
        CONFIG_PACKAGE_kmod-dsa-rtl8366rb=y
        CONFIG_PACKAGE_kmod-switch-rtl8366-smi=y
        CONFIG_PACKAGE_kmod-dsa-tag-rtl4-a=y
        EOF

        # Konfiguration bereinigen und Abhängigkeiten auflösen
        make defconfig
        make -C target/linux olddefconfig || true
