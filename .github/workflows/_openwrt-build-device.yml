name: OpenWrt build device

on:
  workflow_call:
    inputs:
      device:
        description: Gerätename für Artefakt-Bezeichnungen.
        required: true
        type: string
      config_file:
        description: Pfad zur Konfigurationsdatei im Repository für openwrt/.config.
        required: true
        type: string
      extra_config_file:
        description: Optionale zusätzliche Konfigurationsfragmente.
        default: ""
        type: string
      workflow_name:
        description: Logischer Workflow-/Gerätename für benutzerdefinierte Skripte.
        required: true
        type: string
      repo_url:
        description: URL des OpenWrt/ImmortalWrt-Quellcode-Repositories.
        required: true
        type: string
      repo_branch:
        description: Quellcode-Branch oder Tag.
        required: true
        type: string
      feeds_conf:
        description: Pfad zur benutzerdefinierten feeds.conf.default.
        default: feeds.conf.default
        type: string
      diy_p1_sh:
        description: Pfad zum benutzerdefinierten Skript Teil 1.
        default: ./sh/scripts-part1.sh
        type: string
      diy_p2_sh:
        description: Pfad zum benutzerdefinierten Skript Teil 2.
        default: ./sh/scripts-part2.sh
        type: string
      default_setting:
        description: Pfad zum Paket für Standardeinstellungen.
        default: ./default-settings-m0eak
        type: string
      cache_toolchain:
        description: Toolchain-Cache aktivieren.
        default: "true"
        type: string
      timezone:
        description: Zeitzone des Runners.
        default: Europe/Berlin
        type: string
      install_automake_117:
        description: Lokales Automake 1.17 vor dem Klonen kompilieren.
        default: "false"
        type: string
      sonic_fullcone:
        description: Sonic Fullcone NAT-Patch nach Feeds-Installation anwenden.
        default: "false"
        type: string

jobs:
  build:
    name: Kompiliere ${{ inputs.device }}
    # Feste Ubuntu-Version: Workarounds für Runner-Hang/Timeouts sind aktiv
    runs-on: ubuntu-22.04
    steps:
      - name: Repository auschecken
        uses: actions/checkout@main

      - name: Runner-Umgebung anzeigen
        shell: bash
        run: |
          echo "::group::Workflow-Eingabeparameter"
          echo "device=${{ inputs.device }}"
          echo "workflow_name=${{ inputs.workflow_name }}"
          echo "repo_url=${{ inputs.repo_url }}"
          echo "repo_branch=${{ inputs.repo_branch }}"
          echo "config_file=${{ inputs.config_file }}"
          echo "extra_config_file=${{ inputs.extra_config_file }}"
          echo "feeds_conf=${{ inputs.feeds_conf }}"
          echo "diy_p1_sh=${{ inputs.diy_p1_sh }}"
          echo "diy_p2_sh=${{ inputs.diy_p2_sh }}"
          echo "default_setting=${{ inputs.default_setting }}"
          echo "cache_toolchain=${{ inputs.cache_toolchain }}"
          echo "install_automake_117=${{ inputs.install_automake_117 }}"
          echo "sonic_fullcone=${{ inputs.sonic_fullcone }}"
          for path in \
            "${{ inputs.config_file }}" \
            "${{ inputs.extra_config_file }}" \
            "${{ inputs.feeds_conf }}" \
            "${{ inputs.diy_p1_sh }}" \
            "${{ inputs.diy_p2_sh }}" \
            "${{ inputs.default_setting }}" \
            "files"; do
            [ -z "$path" ] && continue
            if [ -e "$path" ]; then
              echo "Gefunden: $path"
            else
              echo "Nicht vorhanden: $path"
            fi
          done
          echo "::endgroup::"

          echo "::group::Runner-Systemumgebung"
          echo "================================================="
          echo "GitHub Actions Runner Umgebungsinformationen"
          echo "================================================="
          lscpu
          echo "Verfügbare CPU-Threads: $(nproc)"
          free -h
          df -hT
          uname -a
          lsb_release -a || true
          echo "::endgroup::"

      - name: Speicherplatz optimieren
        uses: hugoalh/disk-space-optimizer-ghaction@v0.8.1
        with:
          operate_sudo: "True"
          general_include: ".+"
          general_exclude: |-
            ^GCC$
            ^G\+\+$
            Clang
            LLVM
          docker_prune: "True"
          docker_clean: "True"
          apt_prune: "True"
          apt_clean: "True"

      - name: Große vorinstallierte Tools entfernen
        shell: bash
        run: |
          echo "Festplattenbelegung vor der Bereinigung:"
          df -hT
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /usr/share/swift /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          echo "Festplattenbelegung nach der Bereinigung:"
          df -hT

      - name: Block-Device Readahead anpassen (Schutz vor Runner-Verbindungsverlust)
        shell: bash
        run: |
          # Reduziert read_ahead_kb von 4096 auf 128, um I/O-Spitzen und Runner-Abbrüche zu verhindern
          echo "== read_ahead_kb vor der Anpassung =="
          for f in /sys/block/*/queue/read_ahead_kb; do printf '%s = %s\n' "$f" "$(cat "$f" 2>/dev/null)"; done
          for f in /sys/block/*/queue/read_ahead_kb; do echo 128 | sudo tee "$f" >/dev/null 2>&1 || true; done
          echo "== read_ahead_kb nach der Anpassung =="
          for f in /sys/block/*/queue/read_ahead_kb; do printf '%s = %s\n' "$f" "$(cat "$f" 2>/dev/null)"; done

      - name: Build-Umgebung initialisieren
        shell: bash
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
          TZ: ${{ inputs.timezone }}
        run: |
          while sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do
            echo "Warte darauf, dass apt-Locks frei werden..."
            sleep 5
          done

          sudo rm -rf /etc/apt/sources.list.d/*
          sudo -E apt-get -yqq update
          sudo -E apt-get -yqq purge azure-cli* ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* || true

          # Verhindert Runner-Verbindungsabbrüche durch unnötiges Kernel-/System-Full-Upgrade
          sudo apt-mark hold systemd systemd-resolved systemd-sysv dbus udev libsystemd0 libdbus-1-3 || true
          curl -s https://build-scripts.immortalwrt.org/init_build_environment.sh -o /tmp/iwe.sh
          sed -i 's/^[[:space:]]*apt full-upgrade.*/: # full-upgrade entfernt (Workaround fuer Runner-Lost)/' /tmp/iwe.sh
          grep -q "Workaround fuer Runner-Lost" /tmp/iwe.sh || { echo "FEHLER: Entfernen von full-upgrade fehlgeschlagen"; exit 1; }
          sudo NEEDRESTART_MODE=n NEEDRESTART_SUSPEND=1 bash /tmp/iwe.sh
          sudo apt-mark unhold systemd systemd-resolved systemd-sysv dbus udev libsystemd0 libdbus-1-3 || true

          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
          sudo -E apt-get install -y clang llvm nodejs dwarves
          sudo npm install -g pnpm
          sudo -E apt-get -yqq autoremove --purge
          sudo -E apt-get -yqq clean
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown "$USER:$(id -gn)" /workdir
          echo "WORKFLOW_NAME=${{ inputs.workflow_name }}" >> "$GITHUB_ENV"
          echo "TAG=${{ inputs.repo_branch }}" >> "$GITHUB_ENV"

      - name: Automake 1.17 lokal kompilieren
        if: ${{ inputs.install_automake_117 == 'true' }}
        shell: bash
        run: |
          set -e
          PREFIX=/workdir/automake-1.17
          BUILD_DIR=/workdir/automake-1.17-build
          mkdir -p "$BUILD_DIR"
          cd "$BUILD_DIR"
          OK=0
          for base in \
            "https://ftp.gnu.org/gnu/automake" \
            "https://mirrors.kernel.org/gnu/automake" \
            "https://mirror.netcologne.de/gnu/automake" \
            "https://mirrors.tuna.tsinghua.edu.cn/gnu/automake"; do
            echo "Versuche Download von: $base/automake-1.17.tar.xz"
            if curl -fL --connect-timeout 20 --max-time 120 -o automake-1.17.tar.xz "$base/automake-1.17.tar.xz"; then
              OK=1; echo "Download erfolgreich: $base"; break
            fi
            echo "Download fehlgeschlagen, wechsle zum naechsten Mirror..."
          done
          [ "$OK" = "1" ] || { echo "KRITISCH: Alle Download-Quellen fuer automake fehlgeschlagen"; exit 1; }
          rm -rf automake-1.17-src
          mkdir -p automake-1.17-src
          tar -xf automake-1.17.tar.xz -C automake-1.17-src --strip-components=1
          cd automake-1.17-src
          ./configure --prefix="$PREFIX"
          make -j"$(nproc)"
          make install
          echo "$PREFIX/bin" >> "$GITHUB_PATH"
          "$PREFIX/bin/automake-1.17" --version | sed -n '1p'
          "$PREFIX/bin/aclocal-1.17" --version | sed -n '1p'

      - name: Quellcode klonen
        id: clone-source
        shell: bash
        working-directory: /workdir
        run: |
          git clone -b "${{ inputs.repo_branch }}" "${{ inputs.repo_url }}" --single-branch --depth 1 openwrt
          ln -sf /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"
          cd openwrt
          git fetch --tags || true
          echo "::group::OpenWrt Quellcode-Revision"
          git log -1 --oneline
          git remote -v
          git status --short
          echo "::endgroup::"
          echo "OPENWRT_PATH=$PWD" >> "$GITHUB_ENV"
          echo "openwrt-path=$PWD" >> "$GITHUB_OUTPUT"

      - name: Feeds aktualisieren und DIY-Skript Teil 1 ausführen
        shell: bash
        run: |
          cd openwrt
          [ -e "$GITHUB_WORKSPACE/${{ inputs.feeds_conf }}" ] && cp "$GITHUB_WORKSPACE/${{ inputs.feeds_conf }}" ./feeds.conf.default
          echo "::group::Feeds-Konfiguration"
          pwd
          ls -l feeds.conf.default || true
          sed -n '1,80p' feeds.conf.default || true
          echo "::endgroup::"
          ./scripts/feeds update -a
          chmod +x "$GITHUB_WORKSPACE/${{ inputs.diy_p1_sh }}"
          "$GITHUB_WORKSPACE/${{ inputs.diy_p1_sh }}"

      - name: Feeds installieren
        shell: bash
        run: cd openwrt && ./scripts/feeds install -a

      - name: Sonic Fullcone Patch anwenden
        if: ${{ inputs.sonic_fullcone == 'true' }}
        shell: bash
        run: |
          cd openwrt
          curl -sSL https://raw.githubusercontent.com/mufeng05/openwrt-sonic-fullcone/master/add_sonic_fullcone.sh | bash

      - name: Benutzerdefinierte Konfiguration anwenden und DIY-Skript Teil 2 ausführen
        shell: bash
        run: |
          [ -e "$GITHUB_WORKSPACE/${{ inputs.default_setting }}" ] && mv "$GITHUB_WORKSPACE/${{ inputs.default_setting }}" openwrt/package/default-settings-m0eak
          [ -d "$GITHUB_WORKSPACE/files" ] && mv "$GITHUB_WORKSPACE/files" openwrt/files
          [ -e "${{ inputs.config_file }}" ] && mv "${{ inputs.config_file }}" openwrt/.config
          if [ -n "${{ inputs.extra_config_file }}" ] && [ -e "${{ inputs.extra_config_file }}" ]; then
            cat "${{ inputs.extra_config_file }}" >> openwrt/.config
          fi
          cd openwrt
          echo "::group::Status vor make defconfig"
          pwd
          ls -ld package/default-settings-m0eak files .config 2>/dev/null || true
          grep -E '^(CONFIG_TARGET|CONFIG_PACKAGE_(docker|dockerd|luci-app-dockerman|containerd|runc))' .config || true
          echo "::endgroup::"
          chmod +x "$GITHUB_WORKSPACE/${{ inputs.diy_p2_sh }}"
          "$GITHUB_WORKSPACE/${{ inputs.diy_p2_sh }}"
          make defconfig
          echo "::group::Aktuelle Konfigurationsdifferenz (diffconfig)"
          ./scripts/diffconfig.sh
          echo "::endgroup::"

      - name: Toolchain zwischenspeichern (Cache)
        uses: HiGarfield/cachewrtbuild@main
        if: ${{ inputs.cache_toolchain != 'false' }}
        with:
          ccache: true
          mixkey: ${{ github.workflow }}-${{ inputs.workflow_name }}-${{ hashFiles(inputs.config_file, '**/scripts-part*.sh') }}
          prefix: ${{ steps.clone-source.outputs.openwrt-path }}

      - name: Paketquellen herunterladen (make download)
        shell: bash
        run: |
          cd openwrt
          make download -j"$(nproc)" || make download -j1 V=s
          echo "::group::Übersicht Download-Verzeichnis"
          du -sh dl || true
          find dl -size -1024c -exec ls -l {} \; || true
          echo "::endgroup::"
          find dl -size -1024c -exec rm -f {} \;

      - name: Firmware kompilieren
        shell: bash
        run: |
          cd openwrt
          echo "Kompiliere mit $(nproc) Threads..."
          make -j"$(expr "$(nproc)" + 1)" || make -j1 V=s

      - name: Temporäre Build-Dateien bereinigen
        if: success()
        shell: bash
        run: |
          cd openwrt
          rm -rf build_dir tmp

      - name: Firmware-Dateien organisieren
        id: organize
        shell: bash
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages
          echo "::group::Generierte Firmware-Dateien"
          pwd
          find . -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          echo "::endgroup::"
          echo "FIRMWARE_PATH=$PWD" >> "$GITHUB_ENV"
          echo "firmware-path=$PWD" >> "$GITHUB_OUTPUT"

      - name: LuCI-Paketliste aus finaler Konfiguration extrahieren
        shell: bash
        run: |
          CONFIG_BUILDINFO="${{ steps.organize.outputs.firmware-path }}/config.buildinfo"
          echo "::group::Extrahiere installierte LuCI-Pakete"
          echo "Lese LuCI-Pakete aus: $CONFIG_BUILDINFO"
          if [ ! -s "$CONFIG_BUILDINFO" ]; then
            echo "FEHLER: config.buildinfo nicht gefunden oder leer: $CONFIG_BUILDINFO" >&2
            exit 1
          fi
          wc -l "$CONFIG_BUILDINFO"
          sha256sum "$CONFIG_BUILDINFO"

          grep -E '^CONFIG_PACKAGE_luci-app-[^=]+=[ym]$' "$CONFIG_BUILDINFO" | \
            sed -e 's/^CONFIG_PACKAGE_//g' -e 's/=[ym]$//g' | \
            sort > "$GITHUB_WORKSPACE/packages.txt" || true

          if [ -s "$GITHUB_WORKSPACE/packages.txt" ]; then
            cat "$GITHUB_WORKSPACE/packages.txt"
          else
            echo "Keine LuCI-Pakete in der Konfiguration gefunden." > "$GITHUB_WORKSPACE/packages.txt"
          fi
          echo "::endgroup::"

      - name: Paketliste als Artefakt hochladen
        uses: actions/upload-artifact@main
        with:
          name: package-list-${{ inputs.device }}
          path: ${{ github.workspace }}/packages.txt

      - name: Firmware-Dateien als Artefakt hochladen
        uses: actions/upload-artifact@main
        with:
          name: firmware-${{ inputs.device }}
          path: ${{ steps.organize.outputs.firmware-path }}
